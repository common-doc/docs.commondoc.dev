name: Publish docs

# Builds the documentation with the commondoc container action and publishes it to
# GitHub Pages.
#
# The action runs a container, so no PHP toolchain is set up on the runner. It mounts this
# repository at /github/workspace, and the console inside the image changes directory to
# /app, which is why commondoc.config.php names every path absolutely.
#
# The documentation is not kept here. It is checked out beside this repository and the
# configuration names that directory, so the site follows the source branch rather than a
# copy that has to be kept in step.
#
# The action is pinned to a release tag rather than a branch, so the site cannot change
# behaviour because a branch moved. `0` and the image tag the action pulls are published
# from the same release.
#
# Pages takes a directory, so the build writes into the workspace and
# upload-pages-artifact uploads it. `output` is absolute because it is read inside the
# container; `path: build` is relative because the upload runs on the runner, in the
# workspace, after the container has exited.

on:
  push:
    branches: [main]
  # Sent by a repository that has published a release, so a tag there reaches this
  # build without either repository knowing how the other is arranged. A dispatch only
  # starts a workflow that exists on the default branch, which is this one.
  repository_dispatch:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The documentation source, and where this workflow puts it on disk.
  #
  # Two paths, because two filesystems are involved. `DOCS_DIR` is relative and is what
  # the checkout step writes on the runner. `DOCS_PATH` is what the container sees: the
  # action mounts the workspace at /github/workspace, so the same directory has a different
  # absolute path inside the image, and commondoc.config.php must state that one. A check
  # that used the container path on the runner would always fail, because /github does not
  # exist there.
  DOCS_REPOSITORY: common-doc/commondoc
  DOCS_REF: 1.0.x
  DOCS_DIR: commondoc
  DOCS_PATH: /github/workspace/commondoc

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site repository
        uses: actions/checkout@v7

      - name: Check out the documentation source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.DOCS_REPOSITORY }}
          ref: ${{ env.DOCS_REF }}
          path: ${{ env.DOCS_DIR }}
          # The site publishes released versions, which are read from tags, so the clone
          # has to carry the whole history and every tag. A shallow single-branch checkout
          # carries neither and the build would publish no version at all.
          fetch-depth: 0
          fetch-tags: true

      - name: Confirm the source is where the configuration expects it
        run: |
          set -euo pipefail
          [ -d "$DOCS_DIR/docs/v1" ] ||
            { echo "::error::$DOCS_DIR/docs/v1 is missing on the runner, so $DOCS_PATH/docs/v1 would not resolve inside the container either."; exit 1; }

      - name: Build the site
        uses: common-doc/commondoc@1.0.0
        env:
          COMMONDOC_CONFIG: /github/workspace/commondoc.config.php
        with:
          output: /github/workspace/build

      - name: Confirm the build wrote a site
        run: |
          set -euo pipefail
          [ -f build/index.html ] ||
            { echo "::error::The build produced no build/index.html."; exit 1; }
          [ -f build/search-index.json ] ||
            { echo "::error::The build produced no search index."; exit 1; }

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
